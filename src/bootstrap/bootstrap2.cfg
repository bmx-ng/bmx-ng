#
# bmk2 bootstrap configuration
#
# This file is intentionally separate from bootstrap.cfg, which remains the
# production bmk 3.x configuration in a complete BlitzMax NG SDK.
#
# types:
#  t - bootstrap platform/arch
#  m - module native assets
#  a - application
#
#t	win32	x86
#t	win32	x64
#t	linux	x86
#t	linux	x64
#t	linux	arm
#t	linux	arm64
#t	linux	riscv32
#t	linux	riscv64
#t	macos	x64
#t	macos	arm64
#t	raspberrypi	arm
#t	raspberrypi	arm64
#t	haiku	x64
#t	haiku	arm64

# Runtime and standard-library native sources.
m	brl.blitz	*.c	*.h	*.cpp	bdwgc	tree	hash	fast_float	ryu	incbin
m	pub.stdc	*.c
m	pub.lua	lua-5.1.4
m	pub.win32	*.cpp
m	pub.zlib	*.c	*.h
m	pub.freeprocess	*.c
m	pub.macos	*.m	*.h
m	pub.physfs	physfs

m	brl.appstub	*.c	*.m
m	brl.event	*.h
m	brl.keycodes	*.h
m	brl.map	*.c
m	brl.maxlua	*.c
m	brl.reflection	*.c	*.h
m	brl.stringbuilder	*.c	*.h
m	brl.systemdefault	*.c	*.h
m	brl.threads	*.c	*.m
m	brl.math	*.c	*.h
m	brl.io	*.c
m	brl.filesystem	*.c

m	archive.zlib	zlib

# bmk2 manifest hashing and bcc2 compiler support.
m	crypto.libtomcrypt	libtomcrypt
m	crypto.digest	*.c
m	crypto.sha256digest	*.c
m	blitzmax.compiler	*.c

# Installed source repositories are laid out as src/bcc (bcc2) and src/bmk
# (bmk2). bmk2 also accepts bcc's entry point at compiler/bcc.bmx.
a	bcc	*.c
a	bmk	*.c	*.h	*.bmk	*.icns
